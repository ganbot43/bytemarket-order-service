server:
  port: ${ORDER_SERVICE_PORT:8083}

spring:
  cloud:
    openfeign:
      # Envuelve cada llamada a los clientes del catálogo en un circuit
      # breaker. Ojo:
      # la propiedad vive aquí desde Spring Cloud 2022; escrita como
      # "feign.circuitbreaker.enabled" se ignora en silencio y los circuitos
      # quedan registrados pero sin interceptar nada.
      circuitbreaker:
        enabled: true
  application:
    name: bytemarket-order-service
  profiles:
    active: ${SPRING_PROFILE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME_ORDER:bytemarket_order}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  # ── Mensajería ───────────────────────────────────────────────
  # Las dos están en uso y hacen cosas distintas:
  #
  #   RabbitMQ  → la ORDEN de descontar stock. Un consumidor, hay que
  #               ejecutarla una vez, y si se pierde el inventario queda mal.
  #   Kafka     → el HECHO de que el pedido cambió. Varios consumidores,
  #               retenido y releíble; hoy lo lee support-service para avisar
  #               al cliente por correo.
  #
  # El detalle de por qué no sobra ninguna está en KafkaConfig.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Mismo criterio que en Kafka: si el bus no está, que se note rápido.
    # convertAndSend abre la conexión la primera vez, y sin este tope el
    # intento se queda esperando al sistema operativo con el cliente mirando
    # una pantalla parada. El catch de StockPublisher solo entra si el
    # intento FALLA; si se eterniza, no entra.
    connection-timeout: 2000
    template:
      reply-timeout: 2000
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Confirmación de TODAS las réplicas antes de dar el envío por bueno.
      # Con acks=1 (el valor por defecto) el líder confirma y, si se cae antes
      # de replicar, el evento se pierde en silencio.
      acks: all
      retries: 3
      properties:
        # Sin esto el consumidor recibe el nombre de la clase de ORIGEN
        # (com.bytemarket.order.messaging.PedidoEvento) en una cabecera e
        # intenta instanciarla; en support-service esa clase no existe con
        # ese paquete y la deserialización falla. Quitando la cabecera, cada
        # consumidor mapea el JSON a su propia copia del contrato.
        spring.json.add.type.headers: false

        # Cuánto puede tardar un Kafka enfermo en no responder.
        #
        # send() parece asíncrono, pero bloquea el hilo de la petición
        # mientras busca los metadatos del topic, y ese bloqueo dura
        # max.block.ms: por defecto UN MINUTO. El try/catch de alrededor no
        # salva de eso, porque no es una excepción, es espera. Con Kafka
        # caído o con un DNS que no resuelve, cada cambio de estado y cada
        # compra se quedaban colgados hasta agotarlo.
        #
        # Dos segundos es de sobra para un broker sano en la misma red, y
        # convierte un Kafka ausente en un aviso en el log en vez de en una
        # pantalla congelada. El pedido ya está guardado; el evento solo
        # dispara el correo al cliente.
        max.block.ms: 2000
        # Y un techo al total de reintentos, para que los 3 retries de
        # arriba no se conviertan en dos minutos de cola.
        delivery.timeout.ms: 5000
        request.timeout.ms: 2000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# El checkout consulta precios y stock a catalog-service por Feign. Sin estos
# tiempos, una llamada colgada dejaría la compra del cliente esperando.
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 8000

# ── Resiliencia de las llamadas a catalog-service ────────────
# El circuito se abre tras 5 fallos seguidos y, mientras está abierto,
# responde al instante en vez de agotar el timeout. A los 15 segundos deja
# pasar 3 peticiones de prueba: si van bien, se cierra solo.
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Hace falta para que el estado del circuito salga en
        # /actuator/health, que es como se ve desde fuera si order-service
        # está teniendo problemas para hablar con catalog.
        registerHealthIndicator: true
    # ── Nombres de instancia: OJO ──────────────────────────────
    # Spring Cloud NO registra el circuito con la firma del método tal cual.
    # Le quita '#', '(', ')' y las comas, así que
    #   CatalogPricingClient#resolve(List)  →  CatalogPricingClientresolveList
    #
    # Estaban escritos con la firma completa y por tanto NINGUNA clave
    # coincidía: resilience4j ignora en silencio las instancias que no existen.
    # Para los circuitos no se notaba, porque configs.default se aplica a
    # todos de todas formas; para el timelimiter de abajo sí, y los 3s de las
    # lecturas del panel no se estaban aplicando nunca.
    #
    # Los nombres reales se consultan en /actuator/circuitbreakers.
    instances:
      # El checkout: los 8 segundos completos, porque de esta llamada
      # depende que el cliente pueda comprar.
      CatalogPricingClientresolveList:
        baseConfig: default
      CatalogReportingClientlowStockint:
        baseConfig: default
      CatalogReportingClientexportProducts:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 8s
        cancelRunningFuture: true
    instances:
      # Lecturas del panel: esperar 8 segundos para acabar pintando una
      # lista vacía no tiene sentido; a los 3 se corta.
      CatalogReportingClientlowStockint:
        baseConfig: default
        timeoutDuration: 3s
      CatalogReportingClientexportProducts:
        baseConfig: default
        timeoutDuration: 3s

# Valores por defecto para cuando se arranca sin el perfil local (el perfil
# local define los reales en application-local.yml).
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
aws:
  region: ${S3_REGION:us-east-2}
  access:
    key: ${S3_ACCESS_KEY_ID:}
  secret:
    key: ${S3_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${S3_BUCKET:}
    root-prefix: ${S3_ROOT_PREFIX:bytemarket}

# ── Sonda de salud ───────────────────────────────────────────
# Solo se expone "health": los demás endpoints del actuator (env, beans,
# mappings) revelan configuración interna y no hacen falta aquí.
# Lo consulta el healthcheck de Docker, que así espera a que el servicio
# esté REALMENTE listo —base de datos incluida— y no solo a que el puerto
# responda.
management:
  endpoints:
    web:
      exposure:
        # Además de la sonda, los dos endpoints de resilience4j y las
        # métricas. Son los que faltaban: el estado de los circuitos se
        # registraba (health.circuitbreakers, más abajo) pero NO se podía
        # consultar, porque solo se exponía "health" y además con
        # show-details: never, que oculta todos los componentes. El
        # /actuator/health devolvía {"status":"UP"} con el circuito abierto.
        #
        # Siguen fuera env, beans, mappings y configprops: esos revelan la
        # configuración interna y no hacen falta para operar.
        include: health,circuitbreakers,circuitbreakerevents,metrics
  endpoint:
    health:
      # Anónimo ve solo el status —es lo que necesita el healthcheck de
      # Docker, que no se autentica—; el staff con su JWT ve el detalle por
      # componente. Con "never" no lo veía nadie y con "always" lo vería
      # cualquiera desde el 8083, que docker-compose publica.
      show-details: when-authorized
      roles: ADMIN,SUPERADMIN
      probes:
        enabled: true
  health:
    # Añade el estado de los circuitos a /actuator/health.
    #
    # Ojo con lo que NO hace: un circuito abierto no pone el servicio en
    # DOWN (resilience4j deja allowHealthIndicatorToFail en false). Y es lo
    # correcto: si catalog se cae, order-service debe seguir atendiendo
    # —cobrar no depende de poder leer el catálogo entero—. Que un circuito
    # abierto tumbara el healthcheck sacaría de servicio justo al que está
    # aguantando la caída.
    circuitbreakers:
      enabled: true

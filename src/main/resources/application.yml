server:
  port: ${ORDER_SERVICE_PORT:8083}

spring:
  cloud:
    openfeign:
      # Envuelve cada llamada a los clientes del catálogo en un circuit
      # breaker. Ojo:
      # la propiedad vive aquí desde Spring Cloud 2022; escrita como
      # "feign.circuitbreaker.enabled" se ignora en silencio y los circuitos
      # quedan registrados pero sin interceptar nada.
      circuitbreaker:
        enabled: true
  application:
    name: bytemarket-order-service
  profiles:
    active: ${SPRING_PROFILE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME_ORDER:bytemarket_order}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  # Mensajería: preparada, todavía sin usar.
  #
  # Hoy es inerte porque ningún pom.xml incluye AMQP ni Kafka: Spring la
  # ignora. Las credenciales decían user/password, que no coinciden con el
  # guest/guest de la imagen de docker-compose; corregidas para que funcione
  # el día que se active añadiendo al pom:
  #   spring-boot-starter-amqp   (RabbitMQ)
  #   spring-kafka               (Kafka)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9094}
    consumer:
      group-id: ${KAFKA_GROUP:bytemarket-order}
      auto-offset-reset: earliest

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# El checkout consulta precios y stock a catalog-service por Feign. Sin estos
# tiempos, una llamada colgada dejaría la compra del cliente esperando.
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 8000

# ── Resiliencia de las llamadas a catalog-service ────────────
# El circuito se abre tras 5 fallos seguidos y, mientras está abierto,
# responde al instante en vez de agotar el timeout. A los 15 segundos deja
# pasar 3 peticiones de prueba: si van bien, se cierra solo.
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Hace falta para que el estado del circuito salga en
        # /actuator/health, que es como se ve desde fuera si order-service
        # está teniendo problemas para hablar con catalog.
        registerHealthIndicator: true
    instances:
      # El checkout: se le dan los 8 segundos completos porque de esta
      # llamada depende que el cliente pueda comprar.
      CatalogPricingClient#resolve(List):
        baseConfig: default
      # Lecturas del panel: esperar 8 segundos para acabar pintando una
      # lista vacía no tiene sentido; a los 3 se corta.
      CatalogReportingClient#lowStock(int):
        baseConfig: default
      CatalogReportingClient#exportProducts():
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 8s
        cancelRunningFuture: true
    instances:
      CatalogReportingClient#lowStock(int):
        timeoutDuration: 3s
      CatalogReportingClient#exportProducts():
        timeoutDuration: 3s

# Valores por defecto para cuando se arranca sin el perfil local (el perfil
# local define los reales en application-local.yml).
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
aws:
  region: ${S3_REGION:us-east-2}
  access:
    key: ${S3_ACCESS_KEY_ID:}
  secret:
    key: ${S3_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${S3_BUCKET:}
    root-prefix: ${S3_ROOT_PREFIX:bytemarket}

# ── Sonda de salud ───────────────────────────────────────────
# Solo se expone "health": los demás endpoints del actuator (env, beans,
# mappings) revelan configuración interna y no hacen falta aquí.
# Lo consulta el healthcheck de Docker, que así espera a que el servicio
# esté REALMENTE listo —base de datos incluida— y no solo a que el puerto
# responda.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # Añade el estado de los circuitos a /actuator/health. Así se ve desde
    # fuera si order-service está teniendo problemas para hablar con
    # catalog, sin entrar a leer logs.
    circuitbreakers:
      enabled: true

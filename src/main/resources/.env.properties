# Configuración de spring-dotenv (me.paulschwarz:spring-dotenv).
#
# El .env es uno solo y vive en la carpeta padre, compartido por los cinco
# servicios: antes cada uno tenía el suyo y el JWT_SECRET estaba copiado en
# seis sitios. Si al rotarlo se escapaba uno, ese servicio devolvía 401 sin
# dejar rastro en el log.
#
# Al arrancar desde Eclipse (Run As → Spring Boot App) el directorio de
# trabajo es la carpeta del proyecto, así que ".." es la raíz de ByteMarket.
directory=..

# En Docker el directorio de trabajo es /app y ahí no hay ningún .env: la
# configuración llega como variables de entorno desde el compose. Sin esto,
# el arranque fallaría al no encontrar el archivo.
ignoreIfMissing=true

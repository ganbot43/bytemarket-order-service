# Base en memoria para las pruebas de la capa de datos. No toca MySQL.
# MODE=MySQL porque las entidades declaran columnDefinition = "TEXT",
# que H2 solo entiende en modo de compatibilidad.
spring.datasource.url=jdbc:h2:mem:pruebas;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Las pruebas de repositorio no necesitan descubrimiento de servicios.
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
